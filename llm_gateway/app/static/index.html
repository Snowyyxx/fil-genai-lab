<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open-Source LLM Chat</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --ink:#e6e8ec; --muted:#9aa3b2;
    --line:#262b36; --accent:#e08a5b; --user:#243449; --bot:#1c2029;
    --mono:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:12px 18px;border-bottom:1px solid var(--line);background:#12151b}
  header h1{font-size:16px;margin:0;letter-spacing:-.2px}
  header .dot{width:9px;height:9px;border-radius:50%;background:#555;transition:.3s}
  header .dot.ok{background:#5bd08a} header .dot.bad{background:#e06b6b}
  header .status{font:12px/1 var(--mono);color:var(--muted)}
  header .spacer{flex:1}
  select,button,input,textarea{font:inherit;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:8px}
  select{padding:7px 10px}
  .settings{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 18px;border-bottom:1px solid var(--line);background:#12151b;font-size:13px}
  .settings label{color:var(--muted);display:flex;align-items:center;gap:7px}
  .settings input[type=text]{padding:6px 9px;width:260px}
  .settings input[type=range]{accent-color:var(--accent)}
  #chat{flex:1;overflow-y:auto;padding:22px 0}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px}
  .msg{display:flex;gap:12px;margin:16px 0}
  .msg .avatar{width:30px;height:30px;border-radius:8px;flex:none;display:grid;
    place-items:center;font-size:14px;font-weight:600}
  .msg.user .avatar{background:var(--user);color:#9cc4f0}
  .msg.bot  .avatar{background:#2a2119;color:var(--accent)}
  .msg .bubble{background:var(--bot);border:1px solid var(--line);border-radius:12px;
    padding:11px 14px;white-space:pre-wrap;word-wrap:break-word;overflow-x:auto;max-width:100%}
  .msg.user .bubble{background:var(--user);border-color:#2f4056}
  .msg .role{font:11px/1 var(--mono);color:var(--muted);margin-bottom:5px}
  .cursor{display:inline-block;width:7px;height:15px;background:var(--accent);
    margin-left:2px;animation:blink 1s steps(2) infinite;vertical-align:text-bottom}
  @keyframes blink{50%{opacity:0}}
  .empty{color:var(--muted);text-align:center;margin-top:60px}
  .empty code{font-family:var(--mono);background:#11141a;border:1px solid var(--line);
    border-radius:6px;padding:2px 6px;font-size:12.5px}
  footer{border-top:1px solid var(--line);background:#12151b;padding:14px 18px}
  .composer{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  #input{flex:1;resize:none;padding:11px 13px;max-height:180px;min-height:46px;line-height:1.5}
  #send{padding:0 20px;height:46px;background:var(--accent);color:#20140c;border:none;
    font-weight:600;cursor:pointer;border-radius:9px}
  #send:disabled{opacity:.5;cursor:not-allowed}
  #send.stop{background:#e06b6b;color:#1a0e0e}
  .hint{max-width:820px;margin:8px auto 0;color:var(--muted);font-size:11.5px;text-align:center}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <h1>Open-Source LLM Chat</h1>
  <span class="status" id="status">connecting…</span>
  <div class="spacer"></div>
  <label class="status" for="model">model&nbsp;</label>
  <select id="model"></select>
  <button id="clear" style="padding:7px 12px;cursor:pointer">Clear</button>
</header>

<div class="settings">
  <label>system
    <input type="text" id="system" placeholder="(optional) e.g. You are a terse assistant.">
  </label>
  <label>temperature
    <input type="range" id="temp" min="0" max="1.5" step="0.1" value="0.7">
    <span id="tempval" class="status">0.7</span>
  </label>
</div>

<div id="chat">
  <div class="wrap" id="messages">
    <div class="empty" id="empty">
      Talk to a local open-source model.<br>
      Requests go <code>browser → FastAPI → LiteLLM → Ollama</code>.
    </div>
  </div>
</div>

<footer>
  <div class="composer">
    <textarea id="input" placeholder="Message…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send">Send</button>
  </div>
  <div class="hint">Multi-turn: the whole conversation is sent each time. “Clear” starts fresh.</div>
</footer>

<script>
const $ = s => document.querySelector(s);
const messagesEl = $("#messages"), chatEl = $("#chat"), inputEl = $("#input");
const sendBtn = $("#send"), modelSel = $("#model");

let history = [];        // [{role, content}] — the running conversation
let streaming = false;
let controller = null;   // AbortController for the in-flight request

// ── Boot: health check + model list ─────────────────────────────────────────
async function boot(){
  try{
    const r = await fetch("/health");
    const j = await r.json();
    if(!r.ok) throw new Error(j.detail || "unhealthy");
    $("#dot").classList.add("ok");
    $("#status").textContent = "connected";
    modelSel.innerHTML = "";
    (j.models || []).forEach(m => {
      const o = document.createElement("option"); o.value = o.textContent = m;
      modelSel.appendChild(o);
    });
    if(!j.models || !j.models.length){
      $("#status").textContent = "no models — is ollama-pull done?";
    }
  }catch(e){
    $("#dot").classList.add("bad");
    $("#status").textContent = "gateway unreachable";
  }
}
boot();

// ── Rendering ───────────────────────────────────────────────────────────────
function addBubble(role){
  $("#empty")?.remove();
  const msg = document.createElement("div");
  msg.className = "msg " + (role === "user" ? "user" : "bot");
  msg.innerHTML = `
    <div class="avatar">${role === "user" ? "you" : "AI"}</div>
    <div style="min-width:0">
      <div class="role">${role === "user" ? "you" : modelSel.value}</div>
      <div class="bubble"></div>
    </div>`;
  messagesEl.appendChild(msg);
  chatEl.scrollTop = chatEl.scrollHeight;
  return msg.querySelector(".bubble");
}

// ── Send / stream ───────────────────────────────────────────────────────────
async function send(){
  const text = inputEl.value.trim();
  if(!text || streaming) return;

  addBubble("user").textContent = text;
  inputEl.value = "";
  const botBubble = addBubble("bot");
  const cursor = document.createElement("span");
  cursor.className = "cursor"; botBubble.appendChild(cursor);

  setStreaming(true);
  controller = new AbortController();
  let reply = "";

  try{
    const resp = await fetch("/chat/stream", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      signal: controller.signal,
      body: JSON.stringify({
        message: text,
        model: modelSel.value,
        system: $("#system").value.trim() || null,
        history: history,
        temperature: parseFloat($("#temp").value),
      }),
    });
    if(!resp.ok){
      const t = await resp.text();
      botBubble.textContent = "⚠ " + t;
      setStreaming(false); return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      reply += decoder.decode(value, {stream:true});
      botBubble.textContent = reply;
      botBubble.appendChild(cursor);
      chatEl.scrollTop = chatEl.scrollHeight;
    }
  }catch(e){
    if(e.name === "AbortError"){ reply += "\n[stopped]"; }
    else { botBubble.textContent = "⚠ " + e.message; setStreaming(false); return; }
  }

  cursor.remove();
  botBubble.textContent = reply;
  // commit both turns to history for the next request
  history.push({role:"user", content:text});
  history.push({role:"assistant", content:reply});
  setStreaming(false);
}

function setStreaming(on){
  streaming = on;
  sendBtn.textContent = on ? "Stop" : "Send";
  sendBtn.classList.toggle("stop", on);
}

sendBtn.addEventListener("click", () => {
  if(streaming){ controller?.abort(); }
  else { send(); }
});
inputEl.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
$("#temp").addEventListener("input", e => $("#tempval").textContent = e.target.value);
$("#clear").addEventListener("click", () => {
  history = [];
  messagesEl.innerHTML = '<div class="empty">Conversation cleared. Start a new one.</div>';
});
</script>
</body>
</html>
